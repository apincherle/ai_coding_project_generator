server:
  port: ${SERVER_PORT:8080}
  max-http-request-header-size: 16KB
spring:
  application:
    name: customer-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/customers}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
