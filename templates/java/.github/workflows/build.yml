name: build Java starter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # actions/setup-java@v5
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml
      - run: mvn -B verify
      - name: Generate CycloneDX SBOM
        run: mvn -B -Psecurity org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      # actions/upload-artifact@v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: target/bom.json

  # Provenance attestation only on trusted push events (not pull_request / forks).
  attest-sbom:
    name: attest SBOM provenance
    needs: verify
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # actions/download-artifact@v4 — resolved via upload-artifact ecosystem; pin download too
      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sbom
          path: sbom
      # actions/attest-build-provenance@v2
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: sbom/bom.json
