[project]
name = "customer-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_api"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "import-linter>=2.13,<3",
  "mypy>=1.15,<2",
  "pip-audit>=2.10,<3",
  "pre-commit>=4.1,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=src --cov-report=term-missing"

[tool.coverage.report]
fail_under = 70

[tool.importlinter]
root_package = "customer_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain and repository must not depend on the web layer"
type = "forbidden"
source_modules = ["customer_api.domain", "customer_api.repository"]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "customer_api.main"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["src"]
