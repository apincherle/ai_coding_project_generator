name: security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: static analysis (semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # semgrep/semgrep-action@v1
      - uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d
        with:
          config: config/semgrep.yml

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      # gitleaks/gitleaks-action@v3
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: container scan (trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # aquasecurity/trivy-action@v0.36.0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  exception-expiry:
    name: governance exception expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Fail on expired governance exceptions
        shell: pwsh
        run: ./scripts/check-exceptions.ps1 -Path docs/exceptions
