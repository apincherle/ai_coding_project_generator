[project]
name = "project-generator-api"
version = "0.1.0"
description = "Swagger UI for the AI Engineering Starter Kit create-project generator"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator_api"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.1.1,<10",
  "ruff>=0.11,<1"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
